name: Build NetMonitor Pro APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Build native hev-socks5-tunnel
        shell: bash
        run: |
          git clone --recursive https://github.com/heiher/hev-socks5-tunnel native
          cat >> native/Application.mk <<'EOF'
          APP_CFLAGS += -DPKGNAME=com/netmonitor/pro -DCLSNAME=TProxyService
          EOF
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          "$ANDROID_NDK_ROOT/ndk-build" NDK_PROJECT_PATH="$PWD/native" APP_BUILD_SCRIPT="$PWD/native/Android.mk" NDK_APPLICATION_MK="$PWD/native/Application.mk" APP_ABI=arm64-v8a
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp native/libs/arm64-v8a/libhev-socks5-tunnel.so app/src/main/jniLibs/arm64-v8a/

      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetMonitor-Pro-debug
          path: app/build/outputs/apk/debug/app-debug.apk
